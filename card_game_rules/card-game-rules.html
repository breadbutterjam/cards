<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Game Rules</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1b4332;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
  }

  .container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* Nav row */
  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .nav-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.85);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, opacity 0.15s;
  }
  .nav-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.15);
  }
  .nav-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* Image area */
  .image-wrap {
    background: #fff;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rule-image {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.2s ease;
  }
  .rule-image.hidden { opacity: 0; }

  .placeholder {
    padding: 3rem;
    text-align: center;
    color: #aaa;
    font-family: sans-serif;
    font-size: 0.85rem;
    line-height: 1.6;
  }

  /* Action row */
  .action-row {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
  }

  .action-btn {
    flex: 1;
    max-width: 160px;
    border: none;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 1rem;
    cursor: pointer;
    border-radius: 3px;
    transition: filter 0.15s, transform 0.1s;
    font-weight: 600;
  }
  .action-btn:hover { filter: brightness(1.12); }
  .action-btn:active { transform: scale(0.97); }

  .shuffle-btn {
    background: #8b1a1a;
    color: #fdf6e3;
  }
  .reset-btn {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<div class="container">

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="changeGame(-1)">← Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="changeGame(1)">Next →</button>
  </div>

  <div class="image-wrap">
    <img class="rule-image" id="ruleImage"
         src="" alt="Game rules"
         onerror="handleError()"
         onload="handleLoad()">
    <div class="placeholder" id="placeholder" style="display:none">
      Image not found:<br><strong id="expectedFile"></strong>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn shuffle-btn" onclick="shuffleVariant()">🔀 Shuffle</button>
    <button class="action-btn reset-btn" onclick="resetToStandard()">↺ Reset</button>
  </div>

</div>

<script>
  const TOTAL_GAMES = 11;
  const TOTAL_VARIANTS = 5;

  let currentGame = 1;
  let currentVariant = 1;

  function getImagePath(game, variant) {
    return `img/Game${game}${variant}.png`;
  }

  function updateImage(animate) {
    const img = document.getElementById('ruleImage');
    const placeholder = document.getElementById('placeholder');
    const src = getImagePath(currentGame, currentVariant);
    document.getElementById('expectedFile').textContent = src;

    if (animate) {
      img.classList.add('hidden');
      setTimeout(() => {
        img.src = src;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      }, 180);
    } else {
      img.src = src;
      img.style.display = 'block';
      placeholder.style.display = 'none';
    }
  }

  function handleError() {
    const img = document.getElementById('ruleImage');
    img.style.display = 'none';
    document.getElementById('placeholder').style.display = 'block';
  }

  function handleLoad() {
    const img = document.getElementById('ruleImage');
    img.style.display = 'block';
    img.classList.remove('hidden');
    document.getElementById('placeholder').style.display = 'none';
  }

  function updateNav() {
    document.getElementById('prevBtn').disabled = currentGame === 1;
    document.getElementById('nextBtn').disabled = currentGame === TOTAL_GAMES;
  }

  function changeGame(dir) {
    const next = currentGame + dir;
    if (next < 1 || next > TOTAL_GAMES) return;
    currentGame = next;
    currentVariant = 1;
    updateNav();
    updateImage(true);
  }

  function shuffleVariant() {
    const available = [];
    for (let i = 1; i <= TOTAL_VARIANTS; i++) {
      if (i !== currentVariant) available.push(i);
    }
    currentVariant = available[Math.floor(Math.random() * available.length)];
    updateImage(true);
  }

  function resetToStandard() {
    if (currentVariant === 1) return;
    currentVariant = 1;
    updateImage(true);
  }

  // Init
  updateNav();
  updateImage(false);
</script>
</body>
</html>
