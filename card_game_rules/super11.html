<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Super 11</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #10151c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  /* Tab bar */
  .tabbar {
    flex-shrink: 0;
    display: flex;
    background: #10151c;
    padding-top: env(safe-area-inset-top, 0px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 13px 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    transition: color 0.15s;
  }
  .tab .tab-icon { font-size: 15px; line-height: 1; }
  .tab.active { color: #ffffff; }
  .tab::after {
    content: '';
    position: absolute;
    left: 18%; right: 18%; bottom: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: transparent;
    transition: background 0.15s;
  }
  .tab.active::after { background: #c9a84c; }
  .tab:active { color: #ffffff; }

  /* Content */
  .views {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .view {
    position: absolute;
    inset: 0;
    display: none;
  }
  .view.active { display: block; }
  .view iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #f0f4f8;
  }
  #viewRules iframe { background: #1b4332; }
</style>
</head>

  </button>
</div>

</div>

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const framRules = document.getElementById('framRules');
const framScorer = document.getElementById('framScorer');
framRules.srcdoc = b64ToUtf8(RULES_B64);
framScorer.srcdoc = b64ToUtf8(SCORER_B64);

const tabRules = document.getElementById('tabRules');
const tabScorer = document.getElementById('tabScorer');
const viewRules = document.getElementById('viewRules');
const viewScorer = document.getElementById('viewScorer');

function showTab(which) {
  const rules = which === 'rules';
  tabRules.classList.toggle('active', rules);
  tabScorer.classList.toggle('active', !rules);
  viewRules.classList.toggle('active', rules);
  viewScorer.classList.toggle('active', !rules);
}

tabRules.addEventListener('click', () => showTab('rules'));
tabScorer.addEventListener('click', () => showTab('scorer'));
