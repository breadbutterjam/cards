<title>Super 11 — Live View</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4ZrFANSsFTVB2nTYdDMuwVjvfTvNpalI",
    authDomain: "super11-93b14.firebaseapp.com",
    projectId: "super11-93b14",
    storageBucket: "super11-93b14.firebasestorage.app",
    messagingSenderId: "589951512157",
    appId: "1:589951512157:web:5d8f2892d14fffd84367b4"
  };

  const params = new URLSearchParams(location.search);
  const gameId = params.get('game');

  const statusEl = document.getElementById('liveStatus');
  const titleEl = document.getElementById('liveTitle');
  const boardEl = document.getElementById('liveBoard');
  const tableEl = document.getElementById('liveTable');

  let latestRoster = null; // { players: [{name, photo}] }
  let latestScores = null; // { currentRound, gameRounds }

  function computeScore(gameRounds, g, i) {
    const round = (gameRounds[g] && gameRounds[g].entries) || [];
    const e = round[i];
    if (!e) return null;
    if (e.isWinner) {
      let s = 0;
      round.forEach((x, j) => { if (j !== i && x) s += x.raw; });
      return s;
    }
    return -e.raw;
  }

  const avatarSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;

  function render() {
    if (!latestRoster) return; // need at least the player list to draw anything meaningful
    const players = latestRoster.players || [];
    const gameRounds = (latestScores && latestScores.gameRounds) || [];
    const currentRound = (latestScores && latestScores.currentRound) || 0;

    titleEl.textContent = `Game #${currentRound + 1}`;

    // Leaderboard (running totals, sorted)
    const totals = players.map((p, i) => {
      let t = 0;
      for (let g = 0; g < gameRounds.length; g++) {
        const s = computeScore(gameRounds, g, i);
        if (s !== null) t += s;
      }
      return { name: p.name, photo: p.photo, total: t };
    });
    const ranked = [...totals].sort((a, b) => b.total - a.total);

    let boardHtml = '';
    ranked.forEach((p, pos) => {
      const cls = p.total > 0 ? 'hs-pos' : p.total < 0 ? 'hs-neg' : 'hs-zero';
      const avatar = p.photo ? `<img src="${p.photo}">` : avatarSVG;
      boardHtml += `<div class="lb-row">
        <span class="lb-pos">${pos === 0 ? '👑' : pos + 1}</span>
        <span class="lb-avatar">${avatar}</span>
        <span class="lb-name">${p.name}</span>
        <span class="lb-total ${cls}">${p.total > 0 ? '+' : ''}${p.total}</span>
      </div>`;
    });
    boardEl.innerHTML = boardHtml;

    // Round-by-round table
    let tableHtml = '<thead><tr><th>Game</th>';
    players.forEach(p => { tableHtml += `<th>${p.name}</th>`; });
    tableHtml += '</tr></thead><tbody>';
    for (let g = 0; g <= currentRound && g < gameRounds.length; g++) {
      tableHtml += `<tr><td>${g + 1}</td>`;
      players.forEach((p, i) => {
        const e = ((gameRounds[g] && gameRounds[g].entries) || [])[i];
        if (!e) { tableHtml += `<td class="sb-cell hs-zero">–</td>`; return; }
        const s = computeScore(gameRounds, g, i);
        const cls = s > 0 ? 'hs-pos' : s < 0 ? 'hs-neg' : 'hs-zero';
        tableHtml += `<td class="sb-cell ${cls}">${s > 0 ? '+' : ''}${s}${e.isWinner ? ' 👑' : ''}</td>`;
      });
      tableHtml += '</tr>';
    }
    tableHtml += `<tr class="sb-total-row"><td>Total</td>`;
    totals.forEach(t => {
      const cls = t.total > 0 ? 'hs-pos' : t.total < 0 ? 'hs-neg' : 'hs-zero';
      tableHtml += `<td class="sb-cell ${cls}">${t.total > 0 ? '+' : ''}${t.total}</td>`;
    });
    tableHtml += '</tr></tbody>';
    tableEl.innerHTML = tableHtml;

    statusEl.style.display = 'none';
  }

  if (!gameId) {
    statusEl.textContent = 'No game link provided. Ask the host for their share link.';
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      statusEl.textContent = 'Waiting for the host to start sharing…';

      onSnapshot(doc(db, 'games', gameId, 'meta', 'roster'), (snap) => {
        latestRoster = snap.exists() ? snap.data() : null;
        render();
      }, (err) => {
        statusEl.style.display = '';
        statusEl.textContent = 'Live connection unavailable right now.';
        console.warn(err);
      });

      onSnapshot(doc(db, 'games', gameId), (snap) => {
        latestScores = snap.exists() ? snap.data() : null;
        render();
      }, (err) => {
        statusEl.style.display = '';
        statusEl.textContent = 'Live connection unavailable right now.';
        console.warn(err);
      });
    } catch (err) {
      statusEl.textContent = 'Live connection unavailable right now.';
      console.warn(err);
    }
  }
</script>
<style>
  :root {
    --bg: #f0f4f8;
    --accent: #3dd6e0;
    --accent-dark: #1ab8c4;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #1a2634;
    --text-muted: #7a8fa6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #10151c; font-family: 'Nunito', sans-serif; }
  body { display: flex; flex-direction: column; }

  .tabbar { flex-shrink: 0; display: flex; background: #10151c; padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 13px 8px; background: none; border: none; color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; font-family: inherit; cursor: pointer; position: relative; -webkit-user-select: none; user-select: none; transition: color 0.15s; }
  .tab.active { color: #ffffff; }
  .tab::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: transparent; transition: background 0.15s; }
  .tab.active::after { background: #c9a84c; }

  .views { flex: 1; position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; }
  .view iframe { width: 100%; height: 100%; border: 0; display: block; background: #1b4332; }

  #viewLive { overflow-y: auto; background: var(--bg); }
  .live-wrap { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
  .live-badge { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .live-badge .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 5px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 2px; color: var(--text); text-align: center; margin-bottom: 14px; }
  .live-status { text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted); padding: 40px 20px; }

  .leaderboard { background: #fff; border-radius: 14px; padding: 6px 4px; margin-bottom: 18px; box-shadow: 0 2px 14px rgba(0,0,0,0.06); }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-weight: 800; font-size: 14px; }
  .lb-row + .lb-row { border-top: 1px solid #f0f4f8; }
  .lb-pos { width: 22px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .lb-avatar { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #eef3f8; color: #a0b4c4; display: flex; align-items: center; justify-content: center; }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-avatar svg { width: 18px; height: 18px; }
  .lb-name { flex: 1; color: var(--text); }
  .lb-total { font-size: 15px; }

  .hs-pos { color: var(--green); } .hs-neg { color: var(--red); } .hs-zero { color: var(--text-muted); }

  .scoreboard-wrap { width: 100%; overflow-x: auto; border-radius: 12px; border: 1.5px solid #e4ebf2; -webkit-overflow-scrolling: touch; background: #fff; }
  .scoreboard-table { width: 100%; border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
  .scoreboard-table th, .scoreboard-table td { padding: 7px 10px; text-align: center; }
  .scoreboard-table thead th { background: #f5f8fb; font-weight: 800; color: var(--text); position: sticky; top: 0; }
  .scoreboard-table th:first-child, .scoreboard-table td:first-child { text-align: left; font-weight: 800; color: var(--text-muted); position: sticky; left: 0; background: #fff; }
  .scoreboard-table thead th:first-child { background: #f5f8fb; }
  .scoreboard-table tbody tr:nth-child(even) td { background: #fafcff; }
  .scoreboard-table tbody tr:nth-child(even) td:first-child { background: #f4f9fa; }
  .scoreboard-table td.sb-cell { font-weight: 800; }
  .scoreboard-table tr.sb-total-row td { border-top: 2px solid #e4ebf2; font-weight: 900; background: #fff !important; }

  .view-only-note { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin-top: 16px; }
</style>
</head>

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

document.getElementById('framRules').srcdoc = b64ToUtf8(RULES_B64);

const tabRules = document.getElementById('tabRules');
const tabLive = document.getElementById('tabLive');
const viewRules = document.getElementById('viewRules');
const viewLive = document.getElementById('viewLive');

function showTab(which) {
  const rules = which === 'rules';
  tabRules.classList.toggle('active', rules);
  tabLive.classList.toggle('active', !rules);
  viewRules.classList.toggle('active', rules);
  viewLive.classList.toggle('active', !rules);
}

tabRules.addEventListener('click', () => showTab('rules'));
tabLive.addEventListener('click', () => showTab('live'));
